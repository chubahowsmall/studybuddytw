# 自動部署到 Bluehost：推送到 master 時，用 SSH + rsync 把網站檔案同步到主機（public_html）。
# 主機自己的檔案（.htaccess、.well-known/、cgi-bin/ 等）受保護，不會被刪除。
# 部署時會產生 version.json（tag、commit ID、部署時間），首頁頁尾會顯示版本號。
# 設定步驟見 docs/deploy-bluehost.md。
name: Deploy to Bluehost

on:
  push:
    branches: [master]
    tags: ['v*']             # 推送版本 tag（如 v0.0.2）時也重新部署，讓首頁版本號更新
    paths-ignore:            # 只改說明文件時不部署（推送 tag 不受此限制）
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:         # Actions 頁面手動執行
    inputs:
      dry_run:
        description: '試跑：只列出會變更的檔案，不實際上傳或刪除'
        type: boolean
        default: true

concurrency:
  group: deploy-bluehost
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.BLUEHOST_HOST }}
      USER: ${{ secrets.BLUEHOST_USER }}
      PORT: ${{ secrets.BLUEHOST_PORT }}
      DEST: ${{ secrets.BLUEHOST_PATH }}
      KNOWN_HOSTS: ${{ secrets.BLUEHOST_KNOWN_HOSTS }}
      DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0       # 抓完整歷史與 tag，才能算出版本號

      - name: 產生版本資訊（version.json）
        run: |
          # 推送 tag 時，只有 tag 指向 master 最新的 commit 才部署，避免把舊版本蓋上網站
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo "::notice::tag $GITHUB_REF_NAME 不是 master 最新的 commit，略過部署"
            echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$tag" ]; then ahead=$(git rev-list --count "$tag"..HEAD); else ahead=$(git rev-list --count HEAD); fi
          sha=$(git rev-parse HEAD)
          jq -n --arg tag "$tag" --argjson ahead "$ahead" --arg sha "$sha" --arg commit "${sha:0:6}" \
                --arg deployed "$(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M')" --arg deployed_utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{tag:$tag, ahead:$ahead, commit:$commit, sha:$sha, deployed:$deployed, deployed_utc:$deployed_utc}' > version.json
          cat version.json

      - name: 檢查設定
        if: env.SKIP != '1'
        run: |
          for v in HOST USER PORT DEST; do
            if [ -z "${!v}" ]; then echo "::error::缺少 secret：BLUEHOST_${v/DEST/PATH}"; exit 1; fi
          done
          # 防呆：這個網站部署在 public_html（整個網域專用）。
          # 不允許部署到家目錄本身，避免 rsync --delete 刪到 mail、etc 等主機資料夾。
          d="${DEST%/}"
          case "$d" in
            ""|"."|"/"|/home*/"$USER"|/home*/"$USER"/)
              echo "::error::BLUEHOST_PATH=$DEST 太危險，不能部署到家目錄本身，請填 public_html"; exit 1;;
            "~"*)
              echo "::error::BLUEHOST_PATH 不要用 ~，請寫相對於家目錄的路徑，例如 public_html"; exit 1;;
          esac
          [ -n "$DRY_RUN" ] && echo "::notice::試跑模式：不會實際上傳或刪除檔案" || true

      - name: 設定 SSH 金鑰
        if: env.SKIP != '1'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BLUEHOST_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: 測試連線
        if: env.SKIP != '1'
        run: ssh -i ~/.ssh/id_deploy -p "$PORT" -o BatchMode=yes "$USER@$HOST" "mkdir -p '$DEST' && echo 連線成功：\$(hostname)"

      - name: 同步網站檔案
        if: env.SKIP != '1'
        run: |
          rsync -rltvz --delete --itemize-changes $DRY_RUN \
            --chmod=D755,F644 \
            --exclude='.git/' --exclude='.github/' --exclude='.gitignore' \
            --exclude='docs/' --exclude='resources/' \
            --exclude='README.md' --exclude='LICENSE' \
            --exclude='bluehost_deploy*' --exclude='Claude outputs/' \
            --filter='P .htaccess' --filter='P .well-known/' --filter='P cgi-bin/' \
            --filter='P .user.ini' --filter='P php.ini' --filter='P error_log' \
            -e "ssh -i $HOME/.ssh/id_deploy -p $PORT -o BatchMode=yes" \
            ./ "$USER@$HOST:${DEST%/}/"

      - name: 清除金鑰
        if: always()
        run: rm -f ~/.ssh/id_deploy
