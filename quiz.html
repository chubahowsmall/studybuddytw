<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小測驗｜地理 3D 教室</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M2 26 L12 10 L18 18 L22 13 L30 26Z%22 fill=%22%233f7a4f%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/common.js"></script>
<style>
.score{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.score .big{font-size:20px;font-weight:700}
.q .no{font-size:13px;color:var(--ink-3);margin-right:6px}
.q .u{font-size:12px;font-weight:700;color:var(--moss);background:var(--moss-bg);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
#sum td,#sum th{text-align:center}
</style>
</head>
<body>
<header id="site-head"></header>
<main class="wrap">
  <span class="kicker">小測驗・自編題</span>
  <h1>第二次段考地理小測驗</h1>
  <p class="lead">共 25 題，每個主題 5 題。每題只有一個正確答案，選了就會顯示解析（第一次選的答案才計分）。題目都是自編題，不是學校或出版社的考題。</p>
  <div class="chips" id="flt">
    <button class="chip on" data-u="all">全部</button>
    <button class="chip" data-u="3-1">3-1 內外營力</button>
    <button class="chip" data-u="3-2">3-2 等高線</button>
    <button class="chip" data-u="3-3">3-3 臺灣地形</button>
    <button class="chip" data-u="4-12">4-1・4-2 海岸</button>
    <button class="chip" data-u="4-3">4-3 離島</button>
  </div>
  <div class="score"><span>已作答 <span class="big" id="done">0</span> / 25</span><span>答對 <span class="big" id="ok">0</span> 題</span><button class="btn" id="again">全部重新作答</button></div>
  <div id="qs"></div>

  <h2>各單元得分</h2>
  <div class="tscroll"><table class="t" id="sum"></table></div>
  <p class="note" id="adv"></p>
  <div id="pager"></div>
</main>
<footer id="site-foot"></footer>

<script>
(function(){
const FIG={
 valley:'<svg viewBox="0 0 320 170" width="320" role="img" aria-label="等高線圖：三條 V 形等高線，尖端指向數字較大的一側"><rect width="320" height="170" fill="#fbfaf6"/>'+
  [[140,'300'],[100,'400'],[60,'500']].map(([y,t])=>'<path d="M20,'+y+' C90,'+y+' 130,'+(y-8)+' 160,'+(y-48)+' C190,'+(y-8)+' 230,'+y+' 300,'+y+'" fill="none" stroke="#6b5640" stroke-width="1.6"/><text x="300" y="'+(y-5)+'" font-size="12" text-anchor="end" fill="#2b1d10">'+t+'</text>').join('')+
  '<text x="10" y="18" font-size="11" fill="#7a857e">單位：公尺</text></svg>',
 slope:(function(){let s='<svg viewBox="0 0 400 220" width="380" role="img" aria-label="等高線圖：A 側等高線密集、B 側稀疏"><rect width="400" height="220" fill="#fbfaf6"/>';
  for(let i=0;i<5;i++){const L=60+8*i,R=340-30*i,cx=(L+R)/2,rx=(R-L)/2;s+='<ellipse cx="'+cx+'" cy="110" rx="'+rx+'" ry="'+(rx*0.62)+'" fill="none" stroke="#6b5640" stroke-width="1.5"/><text x="'+(R-3)+'" y="'+(104)+'" font-size="11" text-anchor="end" fill="#2b1d10">'+(100*(i+1))+'</text>';}
  s+='<line x1="30" y1="110" x2="370" y2="110" stroke="#d62f2f" stroke-width="2"/><text x="22" y="114" font-size="14" font-weight="700" fill="#d62f2f" text-anchor="end">A</text><text x="378" y="114" font-size="14" font-weight="700" fill="#d62f2f">B</text><text x="10" y="18" font-size="11" fill="#7a857e">單位：公尺</text></svg>';return s;})()
};
const Q=[
 /* 3-1 */
 ['3-1','下列哪一種作用屬於「內營力」？',['河流侵蝕出山谷','海浪拍打岩岸','板塊擠壓使山脈隆起','風把沙子吹成沙丘'],2,'能量來自地球內部的作用才是內營力，例如板塊擠壓、地震、火山。其他三個選項都是流水、波浪、風等外營力。'],
 ['3-1','外營力對地表的整體影響是什麼？',['使地表趨向平緩','使地表起伏變大','使地殼下陷形成海溝','使岩漿噴出地表'],0,'外營力把高處削低、把低處填高，讓地表趨向平緩；使起伏變大、地殼下陷、岩漿噴發都是內營力。'],
 ['3-1','外營力的能量主要來自哪裡？',['地球內部的熱能','地震釋放的能量','板塊運動','太陽能（加上重力）'],3,'外營力的能量來自地球外部，主要是太陽能，再加上重力讓物質往低處移動。地熱、地震、板塊運動都屬於內營力。'],
 ['3-1','河流把上游的土石帶到下游，在河口附近沉積成平原。這個過程依序包含哪些外營力作用？',['堆積 → 搬運 → 侵蝕','侵蝕 → 搬運 → 堆積','隆起 → 侵蝕 → 堆積','風化 → 隆起 → 搬運'],1,'上游土石先被流水「侵蝕」帶走，再被「搬運」到下游，水流變慢時「堆積」成平原。「隆起」是內營力，不屬於這個過程。'],
 ['3-1','臺灣多高山、地震頻繁，主要原因是什麼？',['雨量多，河流侵蝕力強','四面環海，波浪侵蝕強烈','位在歐亞板塊與菲律賓海板塊交界，受板塊擠壓','氣候炎熱，風化作用旺盛'],2,'臺灣位在歐亞板塊與菲律賓海板塊的交界，板塊擠壓使地殼隆起成高山，也造成頻繁的地震，這是內營力的作用。'],
 /* 3-2 */
 ['3-2','等高線圖上，等高線愈密集，表示什麼？',['坡度愈緩','坡度愈陡','海拔愈高','海拔愈低'],1,'等高線密集，代表在很短的水平距離內高度變化很大，所以坡度陡；等高線稀疏則坡度緩。密或疏和海拔高低無關。'],
 ['3-2','下圖的等高線形狀，表示的是什麼地形？',['山脊','山頂','山谷','鞍部'],2,'等高線凸向高處是山谷；凸向低處才是山脊。山谷是雨水匯集、溪流發育的地方。','valley'],
 ['3-2','某張地圖上，相鄰兩條等高線分別是 200 公尺和 250 公尺，這張地圖的等高距是多少？',['50 公尺','200 公尺','250 公尺','450 公尺'],0,'等高距是「相鄰兩條等高線的高度差」：250 − 200 = 50 公尺。'],
 ['3-2','關於等高線，下列敘述何者正確？',['等高線可以任意交叉','等高線愈疏，坡度愈陡','同一條等高線上，各點的高度都相同','等高線凸向低處的是山谷'],2,'同一條等高線上各點高度相同。等高線不會交叉（垂直懸崖例外）；等高線愈疏坡度愈緩；凸向低處的是山脊。'],
 ['3-2','沿著下圖的剖面線 A–B 畫地形剖面圖，剖面的形狀最可能是哪一種？',['A 側陡、B 側緩','A 側緩、B 側陡','兩側一樣陡','中間低、兩側高'],0,'靠近 A 的等高線很密（坡陡），靠近 B 的等高線很疏（坡緩）；最內圈 500 公尺是山頂，所以剖面是中間高、A 側陡、B 側緩。','slope'],
 /* 3-3 */
 ['3-3','臺灣最高峰玉山（3,952 公尺）屬於哪一條山脈？',['中央山脈','雪山山脈','玉山山脈','阿里山山脈'],2,'玉山是玉山山脈的主峰。雪山山脈的主峰是雪山（3,886 公尺），是臺灣第二高峰。'],
 ['3-3','臺灣主要的分水嶺是哪一條山脈？',['中央山脈','海岸山脈','阿里山山脈','雪山山脈'],0,'中央山脈縱貫臺灣南北，是最長的山脈，雨水在山脊兩側分別向東、向西流，所以是主要的分水嶺。'],
 ['3-3','「頂部平坦、四周有陡崖，比周圍的平原高」的地形是哪一種？',['盆地','臺地','平原','丘陵'],1,'這是臺地的特徵，例如林口臺地、桃園臺地、大肚臺地、八卦臺地。盆地則是四周高、中間低。'],
 ['3-3','臺灣面積最大的平原是哪一個？',['屏東平原','蘭陽平原','花東縱谷平原','嘉南平原'],3,'嘉南平原是臺灣面積最大的平原，由濁水溪等河流的沖積物堆積而成。'],
 ['3-3','臺灣東部平原狹小、西部平原廣大，主要原因是什麼？',['東部雨量比西部少很多','高山偏向東部，西側地勢較緩，有大範圍讓河川泥沙堆積','西部受海浪侵蝕比較強','東部人口比較多，平原被開發掉了'],1,'臺灣的高山偏向東部，所以東側坡陡、平原小；西側坡緩，河川帶下的泥沙可以在廣大的範圍堆積成平原。'],
 /* 4-1・4-2 */
 ['4-12','臺灣北部海岸岬角與海灣交錯、海岸線曲折，主要是什麼原因造成的？',['河川泥沙大量堆積','珊瑚礁大量生長','波浪對軟硬不同的岩石侵蝕程度不同','斷層使山地直逼海岸'],2,'堅硬的岩石較能抵抗波浪侵蝕而突出成岬角，較軟的岩石被侵蝕凹入成海灣，所以形成岬灣海岸。'],
 ['4-12','臺灣西部海岸線平直，外海常見沙洲，沙洲內側有潟湖。這是哪一種海岸？',['沙岸','岩岸','斷層海岸','珊瑚礁海岸'],0,'西部河川帶來大量泥沙，海底坡度平緩，泥沙堆積成平直的沙岸，常見沙洲和潟湖，例如外傘頂洲、七股潟湖。'],
 ['4-12','花蓮清水斷崖一帶海岸陡峭、海岸線平直，離岸不遠海水就很深。這是哪一種海岸？',['沙岸','岬灣海岸','珊瑚礁海岸','斷層海岸'],3,'東部海岸受斷層作用影響，山地直逼海岸，形成陡峭平直的斷層海岸。注意：西部沙岸雖然也平直，但地勢平緩、海水淺。'],
 ['4-12','屏東墾丁一帶的海岸，有什麼主要特色？',['多沙洲和潟湖','沿岸有裙礁和隆起珊瑚礁','岬角與海灣交錯，有許多蕈狀岩','高山直逼海岸，形成斷崖'],1,'墾丁海水溫暖清澈，適合珊瑚生長，沿岸有裙礁，陸上也有地殼抬升露出的隆起珊瑚礁。蕈狀岩是北部野柳的海蝕地形。'],
 ['4-12','臺灣西部海岸缺乏天然良港，大型港口（如臺中港）多需人工修築，主要原因是什麼？',['海岸平直、海水淺，泥沙容易淤積','海岸多斷崖，船隻無法靠岸','珊瑚礁太多，阻擋船隻進出','岬角太多，海浪太大'],0,'西部沙岸海岸線平直、缺乏海灣，海水淺而且河川泥沙容易淤積，所以缺少天然良港，港口多需人工修築與維護。'],
 /* 4-3 */
 ['4-3','金門、馬祖屬於哪一類島嶼？',['火山島','珊瑚礁島','大陸島','沙洲'],2,'金門、馬祖原本和中國大陸相連，後來海平面上升被海水隔開，屬於大陸島。臺灣本島也是大陸島。'],
 ['4-3','澎湖群島主要由什麼岩石構成？屬於哪一類島嶼？',['珊瑚礁石灰岩，珊瑚礁島','玄武岩，火山島','和大陸相同的岩層，大陸島','河川沖積的泥沙，沙洲'],1,'澎湖是熔岩流出冷卻形成的玄武岩方山，屬於火山島，海邊常見柱狀玄武岩。不要因為它在臺灣海峽中間就以為是大陸島。'],
 ['4-3','下列哪一個島嶼是珊瑚礁島？',['龜山島','綠島','金門','小琉球'],3,'小琉球是隆起珊瑚礁島，島上到處是珊瑚礁石灰岩。龜山島、綠島是火山島，金門是大陸島。'],
 ['4-3','大陸島和大陸分開，主要是什麼原因？',['海底火山噴發','海平面上升，低處被海水淹沒','珊瑚礁不斷堆積','波浪把陸地切開'],1,'冰河時期海平面較低，島嶼和大陸相連；後來氣候變暖、海平面上升，較低的大陸棚被淹沒，高處就成為和大陸分開的島嶼。'],
 ['4-3','龜山島、綠島、蘭嶼屬於哪一類島嶼？',['火山島','大陸島','珊瑚礁島','沙洲'],0,'這三個島都是火山活動形成的火山島。綠島、蘭嶼周圍雖然也有珊瑚礁，但島嶼本身是火山形成的。']
];
const UN={'3-1':'3-1 內外營力','3-2':'3-2 等高線','3-3':'3-3 臺灣地形','4-12':'4-1・4-2 海岸','4-3':'4-3 離島'};
const LINK={'3-1':'forces.html','3-2':'contour.html','3-3':'taiwan.html','4-12':'coast.html','4-3':'islands.html'};
const ABC='ABCD';
const ans={};
const box=document.getElementById('qs');
function build(){
  box.innerHTML='';
  Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.dataset.u=q[0];
    d.innerHTML='<div class="stem"><span class="no">第 '+(i+1)+' 題</span>'+q[1]+'<span class="u">'+UN[q[0]]+'</span></div>'+(q[5]?'<figure>'+FIG[q[5]]+'</figure>':'')+
      '<div class="opts">'+q[2].map((o,k)=>'<button class="opt" data-k="'+k+'">（'+ABC[k]+'）'+o+'</button>').join('')+'</div><div class="exp"></div>';
    const ex=d.querySelector('.exp');
    d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===q[3];
      if(!(i in ans))ans[i]=ok;
      d.querySelectorAll('.opt').forEach(x=>{x.classList.remove('right','wrong');if(+x.dataset.k===q[3])x.classList.add('right');});
      if(!ok)b.classList.add('wrong');
      ex.innerHTML=(ok?'<b class="ok">答對了。</b>':'<b class="no">答錯了，正確答案是（'+ABC[q[3]]+'）。</b>')+q[4]+(ok?'':' <a href="'+LINK[q[0]]+'">回到單元複習 →</a>');
      ex.classList.add('show');tally();});
    box.appendChild(d);});
  flt();
}
function tally(){
  const ks=Object.keys(ans);document.getElementById('done').textContent=ks.length;document.getElementById('ok').textContent=ks.filter(k=>ans[k]).length;
  let h='<tr><th>單元</th><th>已作答</th><th>答對</th></tr>';const weak=[];
  Object.keys(UN).forEach(u=>{const ids=Q.map((q,i)=>q[0]===u?i:-1).filter(i=>i>=0);const a=ids.filter(i=>i in ans),c=a.filter(i=>ans[i]);
    h+='<tr><td>'+UN[u]+'</td><td>'+a.length+' / 5</td><td>'+c.length+'</td></tr>';if(a.length===5&&c.length<=3)weak.push(u);});
  document.getElementById('sum').innerHTML=h;
  document.getElementById('adv').innerHTML=ks.length===25?(weak.length?'建議再複習：'+weak.map(u=>'<a href="'+LINK[u]+'">'+UN[u]+'</a>').join('、')+'。回到單元頁操作 3D 模型後，再重新作答一次。':'每個單元都答對 4 題以上，很好！考前再看一次各單元的「常見錯誤」提醒。'):'';
}
let cur='all';
function flt(){box.querySelectorAll('.q').forEach(d=>d.style.display=(cur==='all'||d.dataset.u===cur)?'':'none');}
document.querySelectorAll('#flt .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#flt .chip').forEach(x=>x.classList.toggle('on',x===b));cur=b.dataset.u;flt();});
document.getElementById('again').onclick=()=>{for(const k in ans)delete ans[k];build();tally();window.scrollTo({top:0,behavior:'smooth'});};
build();tally();
})();
</script>
</body>
</html>
